
name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wardrobe
          POSTGRES_PASSWORD: wardrobe_ci_password
          POSTGRES_DB: wardrobe_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wardrobe -d wardrobe_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: wardrobe_ai
      POSTGRES_TEST_DB: wardrobe_ai_test
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create test database
        run: |
          PGPASSWORD=wardrobe_ci_password createdb \
            -h localhost \
            -p 5432 \
            -U wardrobe \
            wardrobe_ai_test

      - name: Check code with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Apply database migrations
        run: python -m alembic upgrade head
        env:
          MET_NO_USER_AGENT: ${{ secrets.MET_NO_USER_AGENT }}

      - name: Check migration consistency
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -v
